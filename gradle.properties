# Project-wide Gradle settings.

# AndroidX support — REQUIRED for all modern Android libraries
android.useAndroidX=true

# Kotlin code style for this project
kotlin.code.style=official

# Enables namespacing of each library's R class
android.nonTransitiveRClass=true

# JVM args for Kotlin daemon — prevents OOM during Kotlin compilation
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable Gradle daemon for faster builds
org.gradle.daemon=true

# Enable configuration cache for faster incremental builds
org.gradle.configuration-cache=true
